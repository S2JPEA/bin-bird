<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bins Chickens</title>
  <style>
    /* ---- base / layout ---------------------------------------------------- */
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #11161d; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #eef2f6;
      -webkit-font-smoothing: antialiased;
    }
    #game { display: block; width: 100vw; height: 100vh; touch-action: none; }

    /* ---- UI overlay (filled in later stages: HUD, start/win/fail screens) -- */
    #ui { position: fixed; inset: 0; pointer-events: none; }

    /* small build tag so it's obvious which stage is live */
    #stage-tag {
      position: fixed; left: 10px; bottom: 8px;
      font-size: 12px; letter-spacing: .04em; color: #8fa3b6;
      opacity: .75; pointer-events: none; user-select: none;
    }
  </style>

  <!-- Three.js from CDN, pinned. Addons mapped for later stages (geometry merge, etc.). -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"><!-- HUD + screens added in later stages --></div>
  <div id="stage-tag">Bins Chickens — stage 3 · click to look · WASD move · Shift run</div>

  <script type="module">
    import * as THREE from 'three';

    /* ======================================================================
     * CONFIG — single source of truth (grows each stage; see DESIGN.md §9)
     * Stage 1 only needs world size, palette and camera basics.
     * ==================================================================== */
    const CONFIG = {
      world: {
        size: 120,          // play extent in units (compact CBD, DESIGN.md §9)
        seed: 20260419,     // deterministic city layout
        // river as a diagonal band: s = (x + z) / √2; water where nearS ≤ s ≤ farS
        river: { nearS: 18, farS: 58, y: 0.06 },
        spawn: { x: 0, z: 0, yaw: Math.PI/2 },   // Queen St Mall, looking down the corridor
      },
      palette: {
        sky:    0x9fc6e8,   // hazy Brisbane sky
        fog:    0x9fc6e8,   // match sky so the horizon dissolves
        ground: 0x6b6f68,   // asphalt — the streets between blocks
        pad:    0x8e8f88,   // concrete block / footpath
        mall:   0xb26844,   // terracotta pavers (Queen Street Mall)
        water:  0x3f6f86,   // the Brisbane River
        south:  0x6f8f5a,   // South Bank greenery
        sun:    0xfff2d6,   // warm key light
      },
      camera: {
        fov: 55, near: 0.1, far: 600,
        follow: {
          distance: 9,       // how far behind the ibis the camera sits
          lookHeight: 1.15,  // aim point above the ibis's feet
          posLerp: 0.12,     // camera position smoothing per frame
          minHeight: 0.8,    // never let the camera dip below this
          yawSensitivity: 0.0026,
          pitchSensitivity: 0.0020,
          pitch: 0.28,       // initial elevation (radians)
          pitchMin: -0.15,
          pitchMax: 0.85,
        },
      },
      fog: { near: 60, far: 240 },
      ibis: {
        walkSpeed: 9,        // units / second
        sprintMul: 1.7,      // hold Shift to run
        turnLerp: 0.2,       // how quickly the ibis turns to face travel
        bodyHeight: 0.93,    // torso-root height above the ground (feet at y=0)
        bound: 0.92,         // stay within this fraction of the half-world
        radius: 0.7,         // collision radius for building push-out
      },
    };

    /* ======================================================================
     * RENDERER
     * ==================================================================== */
    const canvas = document.getElementById('game');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    /* ======================================================================
     * SCENE + atmosphere
     * ==================================================================== */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(CONFIG.palette.sky);
    scene.fog = new THREE.Fog(CONFIG.palette.fog, CONFIG.fog.near, CONFIG.fog.far);

    /* ======================================================================
     * CAMERA
     * ==================================================================== */
    const camera = new THREE.PerspectiveCamera(
      CONFIG.camera.fov,
      window.innerWidth / window.innerHeight,
      CONFIG.camera.near,
      CONFIG.camera.far
    );
    camera.position.set(0, 6, 12);
    camera.lookAt(0, 0, 0);
    let camYaw = CONFIG.world.spawn.yaw;         // mouse-controlled orbit yaw
    let camPitch = CONFIG.camera.follow.pitch;   // mouse-controlled elevation

    /* ======================================================================
     * LIGHTS — cheap two-light rig (DESIGN.md §5.1)
     * ==================================================================== */
    const hemi = new THREE.HemisphereLight(CONFIG.palette.sky, CONFIG.palette.ground, 0.9);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(CONFIG.palette.sun, 1.1);
    sun.position.set(40, 60, 20);
    scene.add(sun);

    /* ======================================================================
     * GROUND — stylised plane sized to the world, with a faint street grid
     * ==================================================================== */
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshLambertMaterial({ color: CONFIG.palette.ground })
    );
    ground.rotation.x = -Math.PI / 2;   // lay flat
    scene.add(ground);

    /* ======================================================================
     * WORLD — stylised Brisbane CBD: streets, blocks, buildings, Queen St
     * Mall + Hungry Jack's, the diagonal river, South Bank, and landmarks
     * (DESIGN.md §3.1, §5.1–5.4). Buildings and block pads are InstancedMeshes
     * to keep the draw-call count low. Collision uses simple AABB push-out.
     * ==================================================================== */
    const SQRT2 = Math.SQRT2;
    const COLLIDERS = [];                       // {minX,maxX,minZ,maxZ} for push-out
    const sceneData = { hungryJacks: null };

    const sOf = (x, z) => (x + z) / SQRT2;      // diagonal river coordinate

    // deterministic PRNG (mulberry32) — same city every run (§3.1)
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rng = mulberry32(CONFIG.world.seed);
    const rand = (lo, hi) => lo + (hi - lo) * rng();
    const pick = (arr) => arr[(rng() * arr.length) | 0];

    function addCollider(x, z, w, d) {
      COLLIDERS.push({ minX: x - w/2, maxX: x + w/2, minZ: z - d/2, maxZ: z + d/2 });
    }

    // circle-vs-AABB push-out (DESIGN.md §5.3)
    function resolveCollisions(pos, r) {
      for (const c of COLLIDERS) {
        const cx = Math.max(c.minX, Math.min(pos.x, c.maxX));
        const cz = Math.max(c.minZ, Math.min(pos.z, c.maxZ));
        const dx = pos.x - cx, dz = pos.z - cz;
        const d2 = dx*dx + dz*dz;
        if (d2 >= r*r) continue;
        if (d2 > 1e-6) {
          const d = Math.sqrt(d2), push = r - d;
          pos.x += (dx/d)*push; pos.z += (dz/d)*push;
        } else {                               // centre inside: eject along nearest face
          const l = pos.x-c.minX, rr = c.maxX-pos.x, b = pos.z-c.minZ, f = c.maxZ-pos.z;
          const m = Math.min(l, rr, b, f);
          if (m===l) pos.x = c.minX - r; else if (m===rr) pos.x = c.maxX + r;
          else if (m===b) pos.z = c.minZ - r; else pos.z = c.maxZ + r;
        }
      }
    }

    // keep a grounded ibis on the CBD bank (can't walk onto the water)
    function clampToLand(pos, r) {
      const limit = CONFIG.world.river.nearS - r;
      const s = sOf(pos.x, pos.z);
      if (s > limit) { const over = s - limit; pos.x -= over/SQRT2; pos.z -= over/SQRT2; }
    }

    function buildWorld() {
      const R = CONFIG.world.river;
      const flat = (mesh) => { mesh.rotation.x = -Math.PI/2; return mesh; };

      // --- river water (diagonal band) -----------------------------------
      const water = flat(new THREE.Mesh(
        new THREE.PlaneGeometry(220, (R.farS - R.nearS) + 6),
        new THREE.MeshLambertMaterial({ color: CONFIG.palette.water })));
      water.rotateOnWorldAxis(new THREE.Vector3(0,1,0), Math.PI/4);   // long axis along the river
      const bandC = (R.nearS + R.farS) / 2 / SQRT2;
      water.position.set(bandC, R.y, bandC);
      scene.add(water);

      // --- South Bank (green strip beyond the water) ---------------------
      const south = flat(new THREE.Mesh(
        new THREE.PlaneGeometry(220, 90),
        new THREE.MeshLambertMaterial({ color: CONFIG.palette.south })));
      south.rotateOnWorldAxis(new THREE.Vector3(0,1,0), Math.PI/4);
      const southC = (R.farS + 45) / SQRT2;
      south.position.set(southC, 0.04, southC);
      scene.add(south);
      addWheel((R.farS + 13) / SQRT2, (R.farS + 13) / SQRT2);   // Wheel of Brisbane

      // --- CBD blocks + buildings ----------------------------------------
      const cell = 20, blockHalf = 7;
      const buildings = [];                       // {x,z,w,d,h,color}
      const pads = [];                            // {x,z,w,d}
      const mall = { x0: -50, x1: 8, z0: -6, z1: 6 };   // Queen St Mall corridor
      const tone = [0x9fa6ad, 0x8794a0, 0xb8b2a4, 0x7e8a86, 0xa6927d, 0x6f7d88];

      for (let gx = -2; gx <= 2; gx++) {
        for (let gz = -2; gz <= 2; gz++) {
          const bx = gx*cell, bz = gz*cell;
          if (sOf(bx, bz) > R.nearS - 2) continue;             // over / near the water
          if (bx > mall.x0 - blockHalf && bx < mall.x1 + blockHalf &&
              bz > mall.z0 - blockHalf && bz < mall.z1 + blockHalf) continue;   // Mall corridor
          pads.push({ x: bx, z: bz, w: blockHalf*2, d: blockHalf*2 });
          const n = rng() < 0.5 ? 1 : 2;
          for (let i = 0; i < n; i++) {
            const w = rand(5, 10), d = rand(5, 10), h = rand(6, 26);
            const ox = n === 1 ? rand(-2, 2) : rand(-3.5, 3.5);
            const oz = n === 1 ? rand(-2, 2) : rand(-3.5, 3.5);
            const x = bx + ox, z = bz + oz;
            buildings.push({ x, z, w, d, h, color: pick(tone) });
            addCollider(x, z, w, d);
          }
        }
      }

      // --- Queen Street Mall pavement -----------------------------------
      const mallMesh = flat(new THREE.Mesh(
        new THREE.PlaneGeometry(mall.x1 - mall.x0, mall.z1 - mall.z0),
        new THREE.MeshLambertMaterial({ color: CONFIG.palette.mall })));
      mallMesh.position.set((mall.x0+mall.x1)/2, 0.03, (mall.z0+mall.z1)/2);
      scene.add(mallMesh);

      // shopfronts lining the far side of the Mall
      for (let x = mall.x0 + 6; x <= mall.x1 - 4; x += 11) {
        const h = rand(5, 11), zz = mall.z0 - 5;
        buildings.push({ x, z: zz, w: 8, d: 7, h, color: pick(tone) });
        addCollider(x, zz, 8, 7);
      }
      // near side: a couple of shopfronts (away from Hungry Jack's)
      for (const x of [mall.x1 - 2, mall.x0 + 6]) {
        const h = rand(5, 10), zz = mall.z1 + 5;
        buildings.push({ x, z: zz, w: 8, d: 7, h, color: pick(tone) });
        addCollider(x, zz, 8, 7);
      }

      // Hungry Jack's — the safe zone, prominent in the Mall (DESIGN.md §3.6)
      const hjX = -20, hjZ = mall.z1 + 5;
      addHungryJacks(hjX, hjZ);
      sceneData.hungryJacks = { x: hjX, z: mall.z1 + 1, radius: 9 };

      addClockTower(28, -34);     // City Hall-ish landmark
      addBridge();                // elevated, decorative (not a walkway)

      buildPads(pads);
      buildBuildings(buildings);
    }

    function buildBuildings(list) {
      const inst = new THREE.InstancedMesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshLambertMaterial({ color: 0xffffff }), list.length);
      const dummy = new THREE.Object3D(), col = new THREE.Color();
      list.forEach((b, i) => {
        dummy.position.set(b.x, b.h/2, b.z);
        dummy.scale.set(b.w, b.h, b.d);
        dummy.updateMatrix();
        inst.setMatrixAt(i, dummy.matrix);
        inst.setColorAt(i, col.setHex(b.color));
      });
      inst.instanceMatrix.needsUpdate = true;
      if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
      scene.add(inst);
    }

    function buildPads(list) {
      const inst = new THREE.InstancedMesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshLambertMaterial({ color: CONFIG.palette.pad }), list.length);
      const dummy = new THREE.Object3D();
      list.forEach((p, i) => {
        dummy.position.set(p.x, 0.05, p.z);
        dummy.scale.set(p.w, 0.1, p.d);
        dummy.updateMatrix();
        inst.setMatrixAt(i, dummy.matrix);
      });
      inst.instanceMatrix.needsUpdate = true;
      scene.add(inst);
    }

    function addHungryJacks(x, z) {
      const body = new THREE.Mesh(new THREE.BoxGeometry(10, 7, 9),
        new THREE.MeshLambertMaterial({ color: 0x6a4a35 }));
      body.position.set(x, 3.5, z); scene.add(body);
      const sign = new THREE.Mesh(new THREE.BoxGeometry(6.5, 2.4, 0.5),
        new THREE.MeshStandardMaterial({ color: 0xf4b400, emissive: 0x6a4e00, emissiveIntensity: 0.6 }));
      sign.position.set(x, 6.6, z - 4.7); scene.add(sign);   // faces the Mall (−z)
      addCollider(x, z, 10, 9);
    }

    function addClockTower(x, z) {
      const sand = new THREE.MeshLambertMaterial({ color: 0xcdbb94 });
      const base = new THREE.Mesh(new THREE.BoxGeometry(9, 10, 9), sand);
      base.position.set(x, 5, z); scene.add(base);
      const tower = new THREE.Mesh(new THREE.BoxGeometry(4.6, 16, 4.6), sand);
      tower.position.set(x, 18, z); scene.add(tower);
      const face = new THREE.MeshStandardMaterial({ color: 0xf5f2e6, emissive: 0x2a2820, emissiveIntensity: 0.4 });
      for (const [dx, dz, ry] of [[0,2.35,0],[0,-2.35,Math.PI],[2.35,0,Math.PI/2],[-2.35,0,-Math.PI/2]]) {
        const f = new THREE.Mesh(new THREE.CircleGeometry(1.3, 16), face);
        f.position.set(x+dx, 22, z+dz); f.rotation.y = ry; scene.add(f);
      }
      const roof = new THREE.Mesh(new THREE.ConeGeometry(3.7, 4.2, 4),
        new THREE.MeshLambertMaterial({ color: 0x5a6b74 }));
      roof.position.set(x, 28.2, z); roof.rotation.y = Math.PI/4; scene.add(roof);
      addCollider(x, z, 9, 9);
    }

    function addBridge() {
      const R = CONFIG.world.river;
      const cx = (R.nearS + R.farS) / 2 / SQRT2;
      const deck = new THREE.Mesh(new THREE.BoxGeometry((R.farS - R.nearS) + 26, 0.6, 5),
        new THREE.MeshLambertMaterial({ color: 0x8a8f94 }));
      deck.position.set(cx, 6, cx);
      deck.rotateOnWorldAxis(new THREE.Vector3(0,1,0), -Math.PI/4);   // span across the river
      scene.add(deck);
      const pyMat = new THREE.MeshLambertMaterial({ color: 0x70757a });
      for (const o of [-11, 11]) {
        const py = new THREE.Mesh(new THREE.BoxGeometry(1.3, 13, 1.3), pyMat);
        py.position.set(cx + o/SQRT2, 0, cx + o/SQRT2); scene.add(py);
      }
    }

    function addWheel(x, z) {
      const wg = new THREE.Group();
      const steel = new THREE.MeshStandardMaterial({ color: 0xdbe2e6, metalness: 0.3, roughness: 0.5 });
      wg.add(new THREE.Mesh(new THREE.TorusGeometry(7, 0.45, 8, 24), steel));
      wg.add(new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 6), steel));
      for (let i = 0; i < 6; i++) {                       // spokes
        const s = new THREE.Mesh(new THREE.BoxGeometry(0.15, 14, 0.15), steel);
        s.rotation.z = i / 6 * Math.PI; wg.add(s);
      }
      wg.position.set(x, 8.3, z);
      wg.rotation.y = -Math.PI/4;                         // face the ring toward the CBD
      scene.add(wg);
      const legMat = new THREE.MeshLambertMaterial({ color: 0x9aa1a6 });
      for (const o of [-4.5, 4.5]) {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.6, 9, 0.6), legMat);
        leg.position.set(x + o/SQRT2, 4.5, z + o/SQRT2); scene.add(leg);
      }
    }

    buildWorld();

    /* ======================================================================
     * IBIS — faceted "statue" bin chicken (DESIGN.md §3.2), styled after the
     * angular Brisbane ibis sculptures: flat-shaded metal panels + hooked bill.
     * root (world position + facing yaw) → body group (waddle) → parts.
     * Local forward is +Z (torso long axis, neck and beak lead that way).
     * ==================================================================== */
    function createIbis() {
      // Faceted, flat-shaded "sculpture" look, modelled on Brisbane's angular
      // ibis statues: pale metal panels, black hooked bill, thin dark legs.
      const COL = { body: 0xe9e7df, dark: 0x191a1f, leg: 0x2b2d33, spec: 0xd8d8d2 };
      const mk = (color, opts = {}) => new THREE.MeshStandardMaterial(
        Object.assign({ color, flatShading: true, roughness: 0.68, metalness: 0.14 }, opts)
      );
      const matBody = mk(COL.body);
      const matDark = mk(COL.dark, { roughness: 0.55, metalness: 0.22 });
      const matLeg  = mk(COL.leg,  { roughness: 0.5,  metalness: 0.35 });
      const matSpec = mk(COL.spec, { roughness: 0.4,  metalness: 0.4  });

      const root = new THREE.Group();   // placement + yaw
      const body = new THREE.Group();   // animation transforms
      root.add(body);

      // torso — faceted teardrop; an icosahedron gives clean flat panels
      const torso = new THREE.Mesh(new THREE.IcosahedronGeometry(0.62, 1), matBody);
      torso.scale.set(0.92, 1.02, 1.4);
      torso.position.y = 0.05;
      body.add(torso);

      // breast — angular wedge for the statue's sharp chest
      const breast = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.62, 5), matBody);
      breast.position.set(0, -0.04, 0.46);
      breast.rotation.x = Math.PI * 0.5;   // point forward
      body.add(breast);

      // tail — long pointed pale panel sweeping back and down
      const tail = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.05, 5), matBody);
      tail.position.set(0, 0.02, -0.82);
      tail.rotation.x = -Math.PI * 0.54;
      body.add(tail);

      // neck — tall, tapering, pentagonal (angular), leaning forward
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.2, 1.25, 5), matBody);
      neck.position.set(0, 0.72, 0.5);
      neck.rotation.x = 0.42;
      body.add(neck);

      // head — small black octahedron atop the neck
      const head = new THREE.Group();
      head.position.set(0, 1.28, 0.78);
      body.add(head);
      const skull = new THREE.Mesh(new THREE.OctahedronGeometry(0.19, 0), matDark);
      skull.scale.set(1, 0.9, 1.1);
      head.add(skull);

      // beak — the signature: long straight base + a down-hooked tip, black
      const beakBase = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.62, 4), matDark);
      beakBase.position.set(0, -0.04, 0.42);
      beakBase.rotation.x = Math.PI * 0.56;
      head.add(beakBase);
      const beakTip = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.34, 4), matDark);
      beakTip.position.set(0, -0.2, 0.66);
      beakTip.rotation.x = Math.PI * 0.78;   // hooks sharply downward
      head.add(beakTip);

      // eyes — little pale rings (the statues' quirky "spectacles")
      const ringGeo = new THREE.TorusGeometry(0.06, 0.016, 5, 10);
      for (const sx of [-1, 1]) {
        const eye = new THREE.Mesh(ringGeo, matSpec);
        eye.position.set(0.1 * sx, 0.06, 0.12);
        head.add(eye);
      }

      // wings — flat angular panels folded along the torso (flap in stage 5)
      const wings = [];
      for (const sx of [-1, 1]) {
        const wing = new THREE.Mesh(new THREE.OctahedronGeometry(0.45, 0), matBody);
        wing.scale.set(0.14, 0.52, 0.95);
        wing.position.set(0.48 * sx, 0.08, -0.06);
        body.add(wing);
        wings.push(wing);
      }

      // legs — thin, dark, angular (pentagon section) with a small foot
      const legs = [];
      for (const sx of [-1, 1]) {
        const leg = new THREE.Group();
        leg.position.set(0.16 * sx, -0.28, 0.02);
        const shank = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 0.66, 5), matLeg);
        shank.position.y = -0.33;
        leg.add(shank);
        const foot = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.035, 0.26), matLeg);
        foot.position.set(0, -0.65, 0.07);
        leg.add(foot);
        body.add(leg);
        legs.push(leg);
      }

      root.userData = { body, head, neck, wings, legs, walkPhase: 0 };
      return root;
    }

    const ibis = createIbis();
    ibis.position.set(CONFIG.world.spawn.x, CONFIG.ibis.bodyHeight, CONFIG.world.spawn.z);
    ibis.rotation.y = Math.atan2(-Math.sin(camYaw), -Math.cos(camYaw));   // face the way the camera looks
    scene.add(ibis);

    // shortest-arc angle lerp (keeps turning from spinning the long way round)
    function lerpAngle(a, b, t) {
      let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
      if (d < -Math.PI) d += Math.PI * 2;
      return a + d * t;
    }

    // procedural waddle / idle bob
    function animateIbis(root, dt, moving) {
      const u = root.userData;
      u.walkPhase += dt * (moving ? 10 : 2.2);
      const amp = moving ? 1 : 0.35;
      u.body.position.y = Math.abs(Math.sin(u.walkPhase)) * 0.05 * amp;
      u.body.rotation.z = Math.sin(u.walkPhase) * 0.06 * amp;        // side-to-side waddle
      u.neck.rotation.z = Math.sin(u.walkPhase + 0.5) * 0.04 * amp;
      u.head.rotation.x = Math.sin(u.walkPhase * 2) * 0.05 * amp;    // beak nod
      const swing = moving ? Math.sin(u.walkPhase) * 0.5 : 0;
      u.legs[0].rotation.x = swing;
      u.legs[1].rotation.x = -swing;
    }

    /* ======================================================================
     * INPUT — keyboard + pointer-lock mouse look
     * ==================================================================== */
    const keys = Object.create(null);
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // stop arrow keys / space from scrolling the page
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

    canvas.addEventListener('click', () => {
      if (document.pointerLockElement !== canvas) canvas.requestPointerLock();
    });
    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== canvas) return;
      const f = CONFIG.camera.follow;
      camYaw   -= e.movementX * f.yawSensitivity;
      camPitch -= e.movementY * f.pitchSensitivity;
      camPitch = Math.max(f.pitchMin, Math.min(f.pitchMax, camPitch));
    });

    /* ======================================================================
     * RESIZE
     * ==================================================================== */
    function onResize() {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);

    /* ======================================================================
     * MAIN LOOP — delta-clamped (DESIGN.md §5.7)
     * Stage 2: ground movement relative to the camera + smoothed follow cam.
     * ==================================================================== */
    const clock = new THREE.Clock();
    const UP = new THREE.Vector3(0, 1, 0);
    const fwd = new THREE.Vector3();
    const right = new THREE.Vector3();
    const moveVec = new THREE.Vector3();
    const lookPoint = new THREE.Vector3();
    const camDesired = new THREE.Vector3();

    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);   // clamp to survive tab stalls
      const f = CONFIG.camera.follow;

      // --- movement, relative to camera yaw ---
      fwd.set(-Math.sin(camYaw), 0, -Math.cos(camYaw));   // "forward" = away from camera
      right.crossVectors(fwd, UP).normalize();            // screen-right
      moveVec.set(0, 0, 0);
      if (keys['KeyW'] || keys['ArrowUp'])    moveVec.add(fwd);
      if (keys['KeyS'] || keys['ArrowDown'])  moveVec.sub(fwd);
      if (keys['KeyD'] || keys['ArrowRight']) moveVec.add(right);
      if (keys['KeyA'] || keys['ArrowLeft'])  moveVec.sub(right);

      const moving = moveVec.lengthSq() > 0;
      if (moving) {
        moveVec.normalize();
        const sprint = (keys['ShiftLeft'] || keys['ShiftRight']) ? CONFIG.ibis.sprintMul : 1;
        ibis.position.addScaledVector(moveVec, CONFIG.ibis.walkSpeed * sprint * dt);

        const lim = (CONFIG.world.size / 2) * CONFIG.ibis.bound;   // stay on the map
        ibis.position.x = Math.max(-lim, Math.min(lim, ibis.position.x));
        ibis.position.z = Math.max(-lim, Math.min(lim, ibis.position.z));

        const targetYaw = Math.atan2(moveVec.x, moveVec.z);        // face travel
        ibis.rotation.y = lerpAngle(ibis.rotation.y, targetYaw, CONFIG.ibis.turnLerp);
      }

      // keep the ibis out of buildings and off the water
      resolveCollisions(ibis.position, CONFIG.ibis.radius);
      clampToLand(ibis.position, CONFIG.ibis.radius);
      ibis.position.y = CONFIG.ibis.bodyHeight;

      animateIbis(ibis, dt, moving);

      // --- smoothed follow camera, orbited by the mouse ---
      lookPoint.copy(ibis.position); lookPoint.y += f.lookHeight;
      const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
      camDesired.set(
        lookPoint.x + Math.sin(camYaw) * cp * f.distance,
        lookPoint.y + sp * f.distance,
        lookPoint.z + Math.cos(camYaw) * cp * f.distance
      );
      if (camDesired.y < f.minHeight) camDesired.y = f.minHeight;
      camera.position.lerp(camDesired, f.posLerp);
      camera.lookAt(lookPoint);

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
