<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bins Chickens</title>
  <style>
    /* ---- base / layout ---------------------------------------------------- */
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #11161d; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #eef2f6;
      -webkit-font-smoothing: antialiased;
    }
    #game { display: block; width: 100vw; height: 100vh; touch-action: none; }

    /* ---- UI overlay (HUD now; start/win/fail screens in later stages) ----- */
    #ui { position: fixed; inset: 0; pointer-events: none; }

    #hud { position: fixed; top: 14px; left: 14px; display: flex; gap: 9px; }
    .pill {
      display: flex; align-items: center; gap: 7px;
      background: rgba(18, 24, 32, .60);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 999px; padding: 7px 14px;
      font-size: 14px; color: #eef2f6; white-space: nowrap;
    }
    .pill b { font-weight: 700; font-variant-numeric: tabular-nums; }
    .pill .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .d-health { background: #e05a5a; }
    .d-food   { background: #e0a93b; }
    .d-level  { background: #f2d24a; }
    #objective {
      position: fixed; top: 17px; left: 0; right: 0; text-align: center;
      font-size: 13px; color: #e6edf4; opacity: .82; letter-spacing: .02em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .6);
    }
    .d-flight { background: #5ab0e0; }
    .pill .bar { width: 64px; height: 8px; border-radius: 4px; overflow: hidden;
      background: rgba(255,255,255,.16); }
    .pill .bar i { display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, #4aa3e0, #7fd0ff); transition: width .08s linear; }
    #toast {
      position: fixed; left: 0; right: 0; top: 34%; text-align: center;
      pointer-events: none; opacity: 0; transition: opacity .35s ease;
    }
    #toast span {
      display: inline-block; max-width: 80vw; padding: 12px 22px;
      background: rgba(18, 24, 32, .82); border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px; color: #fff; font-size: 20px; font-weight: 700;
      line-height: 1.3; text-shadow: 0 2px 6px rgba(0,0,0,.5);
    }
    #toast.show { opacity: 1; }

    /* small build tag so it's obvious which stage is live */
    #stage-tag {
      position: fixed; left: 10px; bottom: 8px;
      font-size: 12px; letter-spacing: .04em; color: #8fa3b6;
      opacity: .75; pointer-events: none; user-select: none;
    }
  </style>

  <!-- Three.js from CDN, pinned. Addons mapped for later stages (geometry merge, etc.). -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="hud">
      <div class="pill"><i class="dot d-health"></i>Health <b id="hud-health">$5</b></div>
      <div class="pill"><i class="dot d-food"></i>Food <b id="hud-food">0</b></div>
      <div class="pill"><i class="dot d-level"></i>Level <b id="hud-level">1</b></div>
      <div class="pill" id="hud-flight" style="display:none"><i class="dot d-flight"></i>Flight <span class="bar"><i id="hud-stam"></i></span></div>
    </div>
    <div id="objective">Raid the bins · level up · fly to South Bank</div>
    <div id="toast"><span></span></div>
    <!-- start / win / fail screens added in later stages -->
  </div>
  <div id="stage-tag">Bins Chickens — stage 5 · WASD move · Shift run · SPACE fly (lvl 2+) · click to look</div>

  <script type="module">
    import * as THREE from 'three';

    /* ======================================================================
     * CONFIG — single source of truth (grows each stage; see DESIGN.md §9)
     * Stage 1 only needs world size, palette and camera basics.
     * ==================================================================== */
    const CONFIG = {
      world: {
        seed: 20260419,     // deterministic bin placement
        bounds: { minX: -104, maxX: 62, minZ: -30, maxZ: 30 },   // walkable extent
        // Brisbane River crosses the George-Street (−X) end; South Bank beyond it
        river: { nearX: -50, farX: -92, y: 0.06 },
        southLandingX: -94, // South Bank landing (win target, stage 6)
        mall: { x0: -46, x1: 50, z0: -6, z1: 6 },   // terracotta spine: George −X → Edward +X
        spawn: { x: -2, z: 0, yaw: Math.PI/2 },      // near Albert St, looking toward the river
      },
      palette: {
        sky:    0x9fc6e8,   // hazy Brisbane sky
        fog:    0x9fc6e8,   // match sky so the horizon dissolves
        ground: 0x6b6f68,   // asphalt — the streets between blocks
        pad:    0x8e8f88,   // concrete block / footpath
        mall:   0xb26844,   // terracotta pavers (Queen Street Mall)
        water:  0x3f6f86,   // the Brisbane River
        south:  0x6f8f5a,   // South Bank greenery
        sun:    0xfff2d6,   // warm key light
      },
      camera: {
        fov: 55, near: 0.1, far: 600,
        follow: {
          distance: 9,       // how far behind the ibis the camera sits
          lookHeight: 1.15,  // aim point above the ibis's feet
          posLerp: 0.12,     // camera position smoothing per frame
          minHeight: 0.8,    // never let the camera dip below this
          yawSensitivity: 0.0026,
          pitchSensitivity: 0.0020,
          pitch: 0.28,       // initial elevation (radians)
          pitchMin: -0.15,
          pitchMax: 0.85,
        },
      },
      fog: { near: 60, far: 240 },
      ibis: {
        walkSpeed: 9,        // units / second
        sprintMul: 1.7,      // hold Shift to run
        turnLerp: 0.2,       // how quickly the ibis turns to face travel
        bodyHeight: 0.93,    // torso-root height above the ground (feet at y=0)
        bound: 0.92,         // stay within this fraction of the half-world
        radius: 0.7,         // collision radius for building push-out
      },
      bins: {
        count: 18,
        pickupRadius: 1.8,   // how close to grab the food
        refill: 25,          // seconds for a bin to refill after emptying
        minValue: 1, maxValue: 2,
        spacing: 6,          // minimum distance between bins
      },
      progress: {            // food → level → stats (DESIGN.md §7/§9)
        foodPerLevel: [4, 6, 9, 12],   // L1→2, L2→3, L3→4, L4→5 (cumulative 4/10/19/31)
        flightUnlockLevel: 2,
        winLevel: 5,
        healthBase: 5, healthPerLevel: 2,     // maxHealth: $5 → $13
        staminaBase: 2.0, staminaPerLevel: 0.8, // flight seconds: L2 2.0 → L5 4.4
      },
      flight: {
        speed: 12,           // horizontal units/s while airborne
        ascendSpeed: 7,      // climb rate holding Space
        gravity: 10,         // fall rate when not thrusting
        maxAltitude: 30,     // clears every building
        drainRate: 1.0,      // stamina/s while airborne
        refillRate: 2.0,     // stamina/s recovered on the ground
      },
    };

    /* ======================================================================
     * RENDERER
     * ==================================================================== */
    const canvas = document.getElementById('game');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    /* ======================================================================
     * SCENE + atmosphere
     * ==================================================================== */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(CONFIG.palette.sky);
    scene.fog = new THREE.Fog(CONFIG.palette.fog, CONFIG.fog.near, CONFIG.fog.far);

    /* ======================================================================
     * CAMERA
     * ==================================================================== */
    const camera = new THREE.PerspectiveCamera(
      CONFIG.camera.fov,
      window.innerWidth / window.innerHeight,
      CONFIG.camera.near,
      CONFIG.camera.far
    );
    camera.position.set(0, 6, 12);
    camera.lookAt(0, 0, 0);
    let camYaw = CONFIG.world.spawn.yaw;         // mouse-controlled orbit yaw
    let camPitch = CONFIG.camera.follow.pitch;   // mouse-controlled elevation

    /* ======================================================================
     * LIGHTS — cheap two-light rig (DESIGN.md §5.1)
     * ==================================================================== */
    const hemi = new THREE.HemisphereLight(CONFIG.palette.sky, CONFIG.palette.ground, 0.9);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(CONFIG.palette.sun, 1.1);
    sun.position.set(40, 60, 20);
    scene.add(sun);

    /* ======================================================================
     * GROUND — stylised plane sized to the world, with a faint street grid
     * ==================================================================== */
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(420, 320),
      new THREE.MeshLambertMaterial({ color: CONFIG.palette.ground })
    );
    ground.rotation.x = -Math.PI / 2;   // lay flat
    scene.add(ground);

    /* ======================================================================
     * WORLD — a faithful Queen Street Mall: a terracotta spine from the
     * George-Street / river end (−X) to the Edward-Street end (+X), with the
     * real buildings placed in order on each side, heritage facades and
     * name-signs (DESIGN.md §3.1). Collision uses simple AABB push-out.
     * ==================================================================== */
    const COLLIDERS = [];                       // {minX,maxX,minZ,maxZ} for push-out
    const sceneData = { hungryJacks: null };

    // deterministic PRNG (mulberry32) — used for stable bin placement (§3.1)
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function addCollider(x, z, w, d, topY = Infinity) {
      COLLIDERS.push({ minX: x - w/2, maxX: x + w/2, minZ: z - d/2, maxZ: z + d/2, topY });
    }
    const shade = (hex, amt) => new THREE.Color(hex).offsetHSL(0, 0, amt).getHex();

    // circle-vs-AABB push-out (DESIGN.md §5.3)
    function resolveCollisions(pos, r) {
      for (const c of COLLIDERS) {
        if (pos.y > c.topY) continue;          // flying above this rooftop
        const cx = Math.max(c.minX, Math.min(pos.x, c.maxX));
        const cz = Math.max(c.minZ, Math.min(pos.z, c.maxZ));
        const dx = pos.x - cx, dz = pos.z - cz;
        const d2 = dx*dx + dz*dz;
        if (d2 >= r*r) continue;
        if (d2 > 1e-6) {
          const d = Math.sqrt(d2), push = r - d;
          pos.x += (dx/d)*push; pos.z += (dz/d)*push;
        } else {                               // centre inside: eject along nearest face
          const l = pos.x-c.minX, rr = c.maxX-pos.x, b = pos.z-c.minZ, f = c.maxZ-pos.z;
          const m = Math.min(l, rr, b, f);
          if (m===l) pos.x = c.minX - r; else if (m===rr) pos.x = c.maxX + r;
          else if (m===b) pos.z = c.minZ - r; else pos.z = c.maxZ + r;
        }
      }
    }

    // a grounded ibis can't stand on the water: if it's in the river band, push
    // it back to the CBD bank. South Bank (x ≤ farX) and the CBD (x ≥ nearX) are
    // fine. (Stage 6 turns the water-band case into the splash/fail.)
    function clampToLand(pos, r) {
      const R = CONFIG.world.river;
      if (pos.x < R.nearX + r && pos.x > R.farX) pos.x = R.nearX + r;
    }

    function buildWorld() {
      const R = CONFIG.world.river, M = CONFIG.world.mall;
      const flat = (m) => { m.rotation.x = -Math.PI/2; return m; };

      // --- river (crosses the −X / George-Street end) + South Bank -------
      const water = flat(new THREE.Mesh(
        new THREE.PlaneGeometry(R.nearX - R.farX, 190),
        new THREE.MeshLambertMaterial({ color: CONFIG.palette.water })));
      water.position.set((R.nearX + R.farX) / 2, R.y, 0);
      scene.add(water);

      const south = flat(new THREE.Mesh(
        new THREE.PlaneGeometry(80, 190),
        new THREE.MeshLambertMaterial({ color: CONFIG.palette.south })));
      south.position.set(R.farX - 40, 0.04, 0);
      scene.add(south);

      addBridge();                       // Victoria Bridge (decorative landmark)
      addWheel(R.farX - 10, 16);         // Wheel of Brisbane, on South Bank
      addClockTower(-18, -34);           // City Hall clock tower, behind the Adelaide-side row (−z)

      // --- Queen Street Mall pavement (terracotta spine) -----------------
      const pave = flat(new THREE.Mesh(
        new THREE.PlaneGeometry(M.x1 - M.x0 + 6, (M.z1 - M.z0) + 3),
        new THREE.MeshLambertMaterial({ color: CONFIG.palette.mall })));
      pave.position.set((M.x0 + M.x1) / 2, 0.03, 0);
      scene.add(pave);
      addCrossStreet(-4);                // Albert Street
      addCrossStreet(47);                // Edward Street

      // --- buildings in real order, George (−X) → Edward (+X) ------------
      // Facing the river, Hungry Jack's / Uptown are on the LEFT (+z) bank.
      const B = [
        // Elizabeth / river side (+z) — Uptown fronts Elizabeth St
        { name:'UPTOWN',            side:'ne', x0:-46, x1:-26, height:26, style:'modern',   color:0x8b9099, sign:{ fg:'#ffffff', bg:'#17191d' } },
        { name:"HUNGRY JACK'S",     side:'ne', x0:-22, x1:-10, height:10, style:'heritage', color:0x8c5a3a, trim:0xb37c52, sign:{ fg:'#ffd23b', bg:'#d2232a' }, hj:true },
        { name:'REGENT',            side:'ne', x0:2,   x1:14,  height:17, style:'heritage', color:0xcbb48e, trim:0xe6d6a8, sign:{ fg:'#e8c56b', bg:'#241a10' } },
        { name:'WINTERGARDEN',      side:'ne', x0:16,  x1:30,  height:19, style:'modern',   color:0x7f93a0, sign:{ fg:'#ffffff', bg:'#1f7a57' } },
        { name:"TATTERSALL'S",      side:'ne', x0:32,  x1:44,  height:15, style:'heritage', color:0xcfc29c, trim:0xe6dbbb, sign:{ fg:'#2f2416', bg:'#e4d9b6' } },
        { name:'MACARTHUR CENTRAL', side:'ne', x0:49,  x1:59,  height:16, style:'heritage', color:0x9a5f45, trim:0xc08a62, sign:{ fg:'#f2e9d2', bg:'#4a2f22' } },
        // Adelaide side (−z) — Brisbane Arcade runs through to Adelaide St (first two: generic heritage)
        {                           side:'sw', x0:-46, x1:-30, height:18, style:'heritage', color:0xb7a884, trim:0xd8cba3 },
        {                           side:'sw', x0:-26, x1:-12, height:14, style:'heritage', color:0xa98f6e, trim:0xcbb48e },
        { name:'BRISBANE ARCADE',   side:'sw', x0:2,   x1:14,  height:15, style:'arcade',   color:0xd8c49a, trim:0xece0c0, sign:{ fg:'#2f2416', bg:'#e8dcbb' } },
        { name:'BROADWAY',          side:'sw', x0:16,  x1:26,  height:14, style:'modern',   color:0x8c8f97, sign:{ fg:'#ffffff', bg:'#222630' } },
        { name:'QUEENSPLAZA',       side:'sw', x0:30,  x1:50,  height:24, style:'modern',   color:0x8f9aa6, sign:{ fg:'#efe7d8', bg:'#1b2430' } },
      ];
      for (const s of B) {
        const cx = addBuilding(s);
        if (s.hj) sceneData.hungryJacks = { x: cx, z: 2, radius: 9 };
      }
    }

    // a flat panel on a building's mall-facing wall (facade detailing)
    function wallPanel(x, y, z, w, h, d, color) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
        new THREE.MeshLambertMaterial({ color }));
      m.position.set(x, y, z); scene.add(m);
    }
    const spread = (cx, len, i, n) =>
      n <= 1 ? cx : cx - (len*0.5 - 0.7) + (len - 1.4) * (i / (n - 1));

    function addFacade(style, cx, wallZ, len, h, facing, s) {
      const zc = wallZ + facing * 0.26;                          // just in front of the wall
      wallPanel(cx, h + 0.35, wallZ + facing*0.15, len + 0.8, 0.7, 1.3, shade(s.color, -0.12)); // cornice
      if (style === 'heritage' || style === 'arcade') {
        const trim = s.trim || 0xd8c9a6;
        const n = Math.max(2, Math.round(len / 3.4));
        for (let i = 0; i < n; i++)
          wallPanel(spread(cx, len, i, n), h*0.47, zc, 0.5, h*0.9, 0.35, trim);  // pilasters
        wallPanel(cx, 0.9, zc, len, 1.8, 0.4, shade(s.color, -0.06));            // base course
        const ew = Math.min(len*0.3, style === 'arcade' ? 4.6 : 3.4);
        const eh = Math.min(h*0.52, style === 'arcade' ? 6.5 : 4.4);
        wallPanel(cx, eh/2, wallZ + facing*0.34, ew, eh, 0.4, 0x241f1b);         // grand dark entry
        if (style === 'arcade') wallPanel(cx, eh + 0.5, wallZ + facing*0.34, ew + 0.8, 1.0, 0.4, trim); // lintel
      } else {                                                    // modern — glazing bands
        const bands = Math.max(3, Math.round(h / 4));
        for (let i = 1; i < bands; i++)
          wallPanel(cx, h * i / bands, zc, len*0.92, 0.5, 0.2, 0x6b7f8c);
      }
    }

    // name-sign drawn to a canvas texture (asset-free), auto-fitting the text
    function makeSign(text, opts = {}) {
      const w = 512, h = 128, pad = 26;
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = opts.bg || '#15181d'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = opts.fg || '#f3e8cf';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      let size = 78;
      do { ctx.font = `700 ${size}px system-ui, Arial, sans-serif`; size -= 4; }
      while (ctx.measureText(text).width > w - pad*2 && size > 16);
      ctx.fillText(text, w/2, h/2 + 2);
      const tex = new THREE.CanvasTexture(cv); tex.anisotropy = 4;
      const pw = opts.width || 6;
      return new THREE.Mesh(new THREE.PlaneGeometry(pw, pw * h / w),
        new THREE.MeshBasicMaterial({ map: tex }));
    }

    // place one building (body + facade + sign); returns its centre x
    function addBuilding(s) {
      const M = CONFIG.world.mall;
      const dir = s.side === 'sw' ? -1 : 1;           // which side of the mall
      const depth = s.depth || 12;
      const edge = dir < 0 ? M.z0 : M.z1;
      const cz = edge + dir * (depth/2 + 0.5);
      const cx = (s.x0 + s.x1) / 2, len = s.x1 - s.x0, h = s.height;
      const body = new THREE.Mesh(new THREE.BoxGeometry(len, h, depth),
        new THREE.MeshLambertMaterial({ color: s.color }));
      body.position.set(cx, h/2, cz); scene.add(body);
      addCollider(cx, cz, len, depth, h);     // topY = building height (fly over it)

      const wallZ = cz - dir * (depth/2);             // the mall-facing wall
      const facing = -dir;                            // +1 faces +z, −1 faces −z
      addFacade(s.style || 'modern', cx, wallZ, len, h, facing, s);

      if (s.name) {
        const sign = makeSign(s.name, Object.assign({ width: Math.min(len*0.82, 13) }, s.sign || {}));
        sign.position.set(cx, Math.min(h - 1.4, h*0.72), wallZ + facing*0.45);  // in front of pilasters
        if (facing < 0) sign.rotation.y = Math.PI;    // face the mall
        scene.add(sign);
      }
      return cx;
    }

    function addCrossStreet(x) {
      const s = new THREE.Mesh(new THREE.PlaneGeometry(6, 62),
        new THREE.MeshLambertMaterial({ color: CONFIG.palette.ground }));
      s.rotation.x = -Math.PI/2; s.position.set(x, 0.045, 0); scene.add(s);
    }

    function addClockTower(x, z) {       // City Hall clock tower (background landmark)
      const sand = new THREE.MeshLambertMaterial({ color: 0xcdbb94 });
      const base = new THREE.Mesh(new THREE.BoxGeometry(10, 12, 10), sand);
      base.position.set(x, 6, z); scene.add(base);
      const tower = new THREE.Mesh(new THREE.BoxGeometry(5, 22, 5), sand);
      tower.position.set(x, 23, z); scene.add(tower);
      const face = new THREE.MeshStandardMaterial({ color: 0xf5f2e6, emissive: 0x2a2820, emissiveIntensity: 0.4 });
      for (const [dx, dz, ry] of [[0,2.6,0],[0,-2.6,Math.PI],[2.6,0,Math.PI/2],[-2.6,0,-Math.PI/2]]) {
        const f = new THREE.Mesh(new THREE.CircleGeometry(1.5, 16), face);
        f.position.set(x+dx, 29, z+dz); f.rotation.y = ry; scene.add(f);
      }
      const roof = new THREE.Mesh(new THREE.ConeGeometry(4.2, 5, 4),
        new THREE.MeshLambertMaterial({ color: 0x5a6b74 }));
      roof.position.set(x, 36, z); roof.rotation.y = Math.PI/4; scene.add(roof);
    }

    function addBridge() {               // Victoria Bridge — spans the river along −X
      const R = CONFIG.world.river, z = 16;
      const len = (R.nearX - R.farX) + 20;
      const deck = new THREE.Mesh(new THREE.BoxGeometry(len, 0.7, 6),
        new THREE.MeshLambertMaterial({ color: 0x8a8f94 }));
      deck.position.set((R.nearX + R.farX)/2, 6, z); scene.add(deck);
      const pyMat = new THREE.MeshLambertMaterial({ color: 0x70757a });
      for (const px of [R.nearX - 4, (R.nearX + R.farX)/2, R.farX + 4]) {
        const py = new THREE.Mesh(new THREE.BoxGeometry(1.4, 13, 1.4), pyMat);
        py.position.set(px, 0, z); scene.add(py);
      }
    }

    function addWheel(x, z) {            // Wheel of Brisbane — faces across the river
      const wg = new THREE.Group();
      const steel = new THREE.MeshStandardMaterial({ color: 0xdbe2e6, metalness: 0.3, roughness: 0.5 });
      wg.add(new THREE.Mesh(new THREE.TorusGeometry(8, 0.5, 8, 24), steel));
      wg.add(new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 6), steel));
      for (let i = 0; i < 6; i++) {                       // spokes
        const s = new THREE.Mesh(new THREE.BoxGeometry(0.16, 16, 0.16), steel);
        s.rotation.z = i / 6 * Math.PI; wg.add(s);
      }
      const cabMat = new THREE.MeshStandardMaterial({ color: 0xcfd6da });
      for (let i = 0; i < 8; i++) {                       // gondolas
        const a = i / 8 * Math.PI * 2;
        const cab = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.5), cabMat);
        cab.position.set(Math.cos(a)*8, Math.sin(a)*8, 0); wg.add(cab);
      }
      wg.position.set(x, 9.5, z);
      wg.rotation.y = Math.PI/2;                          // ring faces the CBD across the river
      scene.add(wg);
      const legMat = new THREE.MeshLambertMaterial({ color: 0x9aa1a6 });
      for (const o of [-5, 5]) {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.7, 10, 0.7), legMat);
        leg.position.set(x, 5, z + o); scene.add(leg);
      }
    }

    buildWorld();

    /* ======================================================================
     * IBIS — faceted "statue" bin chicken (DESIGN.md §3.2), styled after the
     * angular Brisbane ibis sculptures: flat-shaded metal panels + hooked bill.
     * root (world position + facing yaw) → body group (waddle) → parts.
     * Local forward is +Z (torso long axis, neck and beak lead that way).
     * ==================================================================== */
    function createIbis() {
      // Faceted, flat-shaded "sculpture" look, modelled on Brisbane's angular
      // ibis statues: pale metal panels, black hooked bill, thin dark legs.
      const COL = { body: 0xe9e7df, dark: 0x191a1f, leg: 0x2b2d33, spec: 0xd8d8d2 };
      const mk = (color, opts = {}) => new THREE.MeshStandardMaterial(
        Object.assign({ color, flatShading: true, roughness: 0.68, metalness: 0.14 }, opts)
      );
      const matBody = mk(COL.body);
      const matDark = mk(COL.dark, { roughness: 0.55, metalness: 0.22 });
      const matLeg  = mk(COL.leg,  { roughness: 0.5,  metalness: 0.35 });
      const matSpec = mk(COL.spec, { roughness: 0.4,  metalness: 0.4  });

      const root = new THREE.Group();   // placement + yaw
      const body = new THREE.Group();   // animation transforms
      root.add(body);

      // torso — faceted teardrop; an icosahedron gives clean flat panels
      const torso = new THREE.Mesh(new THREE.IcosahedronGeometry(0.62, 1), matBody);
      torso.scale.set(0.92, 1.02, 1.4);
      torso.position.y = 0.05;
      body.add(torso);

      // breast — angular wedge for the statue's sharp chest
      const breast = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.62, 5), matBody);
      breast.position.set(0, -0.04, 0.46);
      breast.rotation.x = Math.PI * 0.5;   // point forward
      body.add(breast);

      // tail — long pointed pale panel sweeping back and down
      const tail = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.05, 5), matBody);
      tail.position.set(0, 0.02, -0.82);
      tail.rotation.x = -Math.PI * 0.54;
      body.add(tail);

      // neck — tall, tapering, pentagonal (angular), leaning forward
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.2, 1.25, 5), matBody);
      neck.position.set(0, 0.72, 0.5);
      neck.rotation.x = 0.42;
      body.add(neck);

      // head — small black octahedron atop the neck
      const head = new THREE.Group();
      head.position.set(0, 1.28, 0.78);
      body.add(head);
      const skull = new THREE.Mesh(new THREE.OctahedronGeometry(0.19, 0), matDark);
      skull.scale.set(1, 0.9, 1.1);
      head.add(skull);

      // beak — the signature: long straight base + a down-hooked tip, black
      const beakBase = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.62, 4), matDark);
      beakBase.position.set(0, -0.04, 0.42);
      beakBase.rotation.x = Math.PI * 0.56;
      head.add(beakBase);
      const beakTip = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.34, 4), matDark);
      beakTip.position.set(0, -0.2, 0.66);
      beakTip.rotation.x = Math.PI * 0.78;   // hooks sharply downward
      head.add(beakTip);

      // eyes — little pale rings (the statues' quirky "spectacles")
      const ringGeo = new THREE.TorusGeometry(0.06, 0.016, 5, 10);
      for (const sx of [-1, 1]) {
        const eye = new THREE.Mesh(ringGeo, matSpec);
        eye.position.set(0.1 * sx, 0.06, 0.12);
        head.add(eye);
      }

      // wings — flat angular panels folded along the torso (flap in stage 5)
      const wings = [];
      for (const sx of [-1, 1]) {
        const wing = new THREE.Mesh(new THREE.OctahedronGeometry(0.45, 0), matBody);
        wing.scale.set(0.14, 0.52, 0.95);
        wing.position.set(0.48 * sx, 0.08, -0.06);
        body.add(wing);
        wings.push(wing);
      }

      // legs — thin, dark, angular (pentagon section) with a small foot
      const legs = [];
      for (const sx of [-1, 1]) {
        const leg = new THREE.Group();
        leg.position.set(0.16 * sx, -0.28, 0.02);
        const shank = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 0.66, 5), matLeg);
        shank.position.y = -0.33;
        leg.add(shank);
        const foot = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.035, 0.26), matLeg);
        foot.position.set(0, -0.65, 0.07);
        leg.add(foot);
        body.add(leg);
        legs.push(leg);
      }

      root.userData = { body, head, neck, wings, legs, walkPhase: 0 };
      return root;
    }

    const ibis = createIbis();
    ibis.position.set(CONFIG.world.spawn.x, CONFIG.ibis.bodyHeight, CONFIG.world.spawn.z);
    ibis.rotation.y = Math.atan2(-Math.sin(camYaw), -Math.cos(camYaw));   // face the way the camera looks
    scene.add(ibis);

    // shortest-arc angle lerp (keeps turning from spinning the long way round)
    function lerpAngle(a, b, t) {
      let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
      if (d < -Math.PI) d += Math.PI * 2;
      return a + d * t;
    }

    // procedural waddle / idle bob
    function animateIbis(root, dt, moving, flying) {
      const u = root.userData;
      if (flying) {
        u.walkPhase += dt * 16;                               // fast wingbeat
        const flap = Math.sin(u.walkPhase) * 0.9;
        u.wings[0].rotation.z = -0.35 - flap;                 // left wing
        u.wings[1].rotation.z =  0.35 + flap;                 // right wing
        u.body.position.y = 0;
        u.body.rotation.z = 0;
        u.body.rotation.x = 0.22;                             // pitch forward in the air
        u.neck.rotation.z = 0;
        u.head.rotation.x = -0.1;
        u.legs[0].rotation.x = -0.6; u.legs[1].rotation.x = -0.6;   // legs trailing
        return;
      }
      u.wings[0].rotation.z = 0; u.wings[1].rotation.z = 0;   // reset flight pose
      u.body.rotation.x = 0;
      u.walkPhase += dt * (moving ? 10 : 2.2);
      const amp = moving ? 1 : 0.35;
      u.body.position.y = Math.abs(Math.sin(u.walkPhase)) * 0.05 * amp;
      u.body.rotation.z = Math.sin(u.walkPhase) * 0.06 * amp;        // side-to-side waddle
      u.neck.rotation.z = Math.sin(u.walkPhase + 0.5) * 0.04 * amp;
      u.head.rotation.x = Math.sin(u.walkPhase * 2) * 0.05 * amp;    // beak nod
      const swing = moving ? Math.sin(u.walkPhase) * 0.5 : 0;
      u.legs[0].rotation.x = swing;
      u.legs[1].rotation.x = -swing;
    }

    /* ======================================================================
     * INPUT — keyboard + pointer-lock mouse look
     * ==================================================================== */
    const keys = Object.create(null);
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // stop arrow keys / space from scrolling the page
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

    canvas.addEventListener('click', () => {
      if (document.pointerLockElement !== canvas) canvas.requestPointerLock();
    });
    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== canvas) return;
      const f = CONFIG.camera.follow;
      camYaw   -= e.movementX * f.yawSensitivity;
      camPitch -= e.movementY * f.pitchSensitivity;
      camPitch = Math.max(f.pitchMin, Math.min(f.pitchMax, camPitch));
    });

    /* ======================================================================
     * PLAYER STATE + HUD (DESIGN.md §3.9) — health in dollars
     * ==================================================================== */
    const player = { food: 0, level: 1, health: 5, maxHealth: 5, stamina: 0, maxStamina: 0 };
    const P = CONFIG.progress;
    const hudHealth = document.getElementById('hud-health');
    const hudFood   = document.getElementById('hud-food');
    const hudLevel  = document.getElementById('hud-level');
    const hudFlight = document.getElementById('hud-flight');
    const hudStam   = document.getElementById('hud-stam');
    const toastEl   = document.getElementById('toast');
    const toastSpan = toastEl.querySelector('span');
    let toastTimer = 0;

    const canFly        = () => player.level >= P.flightUnlockLevel;
    const maxHealthFor  = (lvl) => P.healthBase + P.healthPerLevel * (lvl - 1);
    const maxStaminaFor = (lvl) => lvl >= P.flightUnlockLevel
      ? P.staminaBase + P.staminaPerLevel * (lvl - P.flightUnlockLevel) : 0;
    const cumulativeFood = (lvl) => P.foodPerLevel.slice(0, lvl - 1).reduce((a, b) => a + b, 0);

    function updateHUD() {
      hudHealth.textContent = '$' + Math.round(player.health);
      hudFood.textContent   = player.food;
      hudLevel.textContent  = player.level;
      if (canFly()) {
        hudFlight.style.display = '';
        hudStam.style.width = (player.maxStamina ? (player.stamina / player.maxStamina) * 100 : 0) + '%';
      }
    }

    function showToast(text, ms = 2800) {
      toastSpan.textContent = text;
      toastEl.classList.add('show');
      toastTimer = ms / 1000;
    }
    function updateToast(dt) {
      if (toastTimer > 0 && (toastTimer -= dt) <= 0) toastEl.classList.remove('show');
    }

    function applyLevel() {                       // bump stats for the new level
      const nm = maxHealthFor(player.level);
      player.health = Math.min(nm, player.health + (nm - player.maxHealth));
      player.maxHealth = nm;
      player.maxStamina = maxStaminaFor(player.level);
      player.stamina = player.maxStamina;         // full tank as a level-up reward
    }
    const LEVEL_LINES = {
      2: 'LEVEL 2! Wings unlocked — hold SPACE to take off, ya legend!',
      3: 'LEVEL 3! Bigger wings, longer flights.',
      4: 'LEVEL 4! Nearly river-ready… keep raiding those bins.',
      5: "LEVEL 5! Full tank — fang it across to South Bank!",
    };
    function checkLevelUp() {
      while (player.level < P.winLevel && player.food >= cumulativeFood(player.level + 1)) {
        player.level++;
        applyLevel();
        showToast(LEVEL_LINES[player.level] || ('LEVEL ' + player.level + '!'));
      }
      updateHUD();
    }

    /* ======================================================================
     * BINS — scavenge junk food; empties on pickup, refills on a timer
     * (DESIGN.md §3.1, §3.4). Not colliders: you walk over them to grab food.
     * ==================================================================== */
    const JUNK = ['fries', 'burger', 'cup', 'donut'];
    function junkMesh(kind) {
      let geo, color, flat = false;
      if (kind === 'fries')  { geo = new THREE.BoxGeometry(0.26, 0.42, 0.26); color = 0xe0a93b; }
      else if (kind === 'burger') { geo = new THREE.SphereGeometry(0.2, 8, 6); color = 0xa5632f; }
      else if (kind === 'cup')    { geo = new THREE.CylinderGeometry(0.14, 0.1, 0.36, 10); color = 0xcf3b2e; }
      else                        { geo = new THREE.TorusGeometry(0.14, 0.06, 8, 12); color = 0xe08aa0; flat = true; }
      const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color }));
      if (kind === 'burger') m.scale.y = 0.7;
      if (flat) m.rotation.x = Math.PI / 2;
      return m;
    }
    function makeBin(x, z, kind) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      g.rotation.y = (x * 0.7 + z * 0.3) % Math.PI;        // vary facing
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.64),
        new THREE.MeshLambertMaterial({ color: 0x3c4a3a }));
      body.position.y = 0.5; g.add(body);
      const lid = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.12, 0.7),
        new THREE.MeshLambertMaterial({ color: 0xcf3b2e }));
      lid.position.set(0, 1.02, 0); g.add(lid);
      const food = junkMesh(kind);
      food.position.y = 1.2; g.add(food);
      scene.add(g);
      return { group: g, food, lid };
    }
    function setBinFull(bin, full) {
      bin.full = full;
      bin.food.visible = full;
      bin.lid.rotation.x = full ? -0.6 : 0;                // lid open when there's food
    }

    const BINS = [];
    function buildBins() {
      const C = CONFIG.bins, M = CONFIG.world.mall;
      const binRng = mulberry32(CONFIG.world.seed + 99);
      const inBuilding = (x, z, m) => COLLIDERS.some(c =>
        x > c.minX - m && x < c.maxX + m && z > c.minZ - m && z < c.maxZ + m);
      let tries = 0;
      while (BINS.length < C.count && tries < 5000) {
        tries++;
        const x = M.x0 + 2 + binRng() * (M.x1 - M.x0 - 4);            // along the mall
        const z = (M.z0 - 1.5) + binRng() * ((M.z1 + 1.5) - (M.z0 - 1.5));  // across it
        if (inBuilding(x, z, 1.0)) continue;               // clear of buildings
        if (BINS.some(b => (b.x - x) ** 2 + (b.z - z) ** 2 < C.spacing ** 2)) continue;
        const kind = JUNK[(binRng() * JUNK.length) | 0];
        const value = C.minValue + ((binRng() * (C.maxValue - C.minValue + 1)) | 0);
        const bin = Object.assign({ x, z, value, refillLeft: 0 }, makeBin(x, z, kind));
        setBinFull(bin, true);
        BINS.push(bin);
      }
    }
    function updateBins(dt, t) {
      const C = CONFIG.bins;
      const px = ibis.position.x, pz = ibis.position.z;
      for (const bin of BINS) {
        if (bin.full) {
          bin.food.position.y = 1.2 + Math.sin(t * 3 + bin.x) * 0.05;   // tempting bob
          bin.food.rotation.y += dt * 0.9;
          const dx = px - bin.x, dz = pz - bin.z;
          if (dx * dx + dz * dz < C.pickupRadius * C.pickupRadius) {
            player.food += bin.value;
            setBinFull(bin, false);
            bin.refillLeft = C.refill;
            checkLevelUp();          // may raise level → health/stamina/flight
            // pickup squawk comes in stage 9
          }
        } else {
          bin.refillLeft -= dt;
          if (bin.refillLeft <= 0) setBinFull(bin, true);
        }
      }
    }

    buildBins();
    updateHUD();

    /* ======================================================================
     * RESIZE
     * ==================================================================== */
    function onResize() {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);

    /* ======================================================================
     * MAIN LOOP — delta-clamped (DESIGN.md §5.7)
     * Stage 2: ground movement relative to the camera + smoothed follow cam.
     * ==================================================================== */
    const clock = new THREE.Clock();
    const UP = new THREE.Vector3(0, 1, 0);
    const fwd = new THREE.Vector3();
    const right = new THREE.Vector3();
    const moveVec = new THREE.Vector3();
    const lookPoint = new THREE.Vector3();
    const camDesired = new THREE.Vector3();
    let vy = 0;                                       // vertical velocity for flight

    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);   // clamp to survive tab stalls
      const f = CONFIG.camera.follow;
      const F = CONFIG.flight;
      const groundY = CONFIG.ibis.bodyHeight;

      // --- horizontal input, relative to camera yaw ---
      fwd.set(-Math.sin(camYaw), 0, -Math.cos(camYaw));   // "forward" = away from camera
      right.crossVectors(fwd, UP).normalize();            // screen-right
      moveVec.set(0, 0, 0);
      if (keys['KeyW'] || keys['ArrowUp'])    moveVec.add(fwd);
      if (keys['KeyS'] || keys['ArrowDown'])  moveVec.sub(fwd);
      if (keys['KeyD'] || keys['ArrowRight']) moveVec.add(right);
      if (keys['KeyA'] || keys['ArrowLeft'])  moveVec.sub(right);
      const moving = moveVec.lengthSq() > 0;

      // --- vertical flight + stamina (DESIGN.md §3.2) ---
      const thrust = canFly() && keys['Space'] && player.stamina > 0;
      let airborne = ibis.position.y > groundY + 0.001;
      if (thrust) vy = F.ascendSpeed;
      else if (airborne) vy -= F.gravity * dt;              // no thrust → fall
      ibis.position.y += vy * dt;
      if (ibis.position.y >= groundY + F.maxAltitude) { ibis.position.y = groundY + F.maxAltitude; if (vy > 0) vy = 0; }
      if (ibis.position.y <= groundY) { ibis.position.y = groundY; vy = 0; }
      airborne = ibis.position.y > groundY + 0.001;
      if (airborne) player.stamina = Math.max(0, player.stamina - F.drainRate * dt);
      else if (player.maxStamina) player.stamina = Math.min(player.maxStamina, player.stamina + F.refillRate * dt);

      // --- horizontal move (flight speed in the air; walk/run on the ground) ---
      if (moving) {
        moveVec.normalize();
        const hSpeed = airborne
          ? (player.stamina > 0 ? F.speed : 2)               // out of puff → barely steer, fall short
          : CONFIG.ibis.walkSpeed * ((keys['ShiftLeft'] || keys['ShiftRight']) ? CONFIG.ibis.sprintMul : 1);
        ibis.position.addScaledVector(moveVec, hSpeed * dt);
        const targetYaw = Math.atan2(moveVec.x, moveVec.z);  // face travel
        ibis.rotation.y = lerpAngle(ibis.rotation.y, targetYaw, CONFIG.ibis.turnLerp);
      }

      // --- bounds + collisions ---
      const Bnd = CONFIG.world.bounds;
      ibis.position.x = Math.max(Bnd.minX, Math.min(Bnd.maxX, ibis.position.x));
      ibis.position.z = Math.max(Bnd.minZ, Math.min(Bnd.maxZ, ibis.position.z));
      resolveCollisions(ibis.position, CONFIG.ibis.radius); // (skips rooftops below you)
      if (!airborne) clampToLand(ibis.position, CONFIG.ibis.radius);

      animateIbis(ibis, dt, moving, airborne);
      updateBins(dt, clock.getElapsedTime());
      updateToast(dt);
      if (canFly()) updateHUD();                            // keep the stamina bar live

      // --- smoothed follow camera (pulls back a touch in flight) ---
      lookPoint.copy(ibis.position); lookPoint.y += f.lookHeight;
      const dist = f.distance + (airborne ? 3 : 0);
      const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
      camDesired.set(
        lookPoint.x + Math.sin(camYaw) * cp * dist,
        lookPoint.y + sp * dist,
        lookPoint.z + Math.cos(camYaw) * cp * dist
      );
      if (camDesired.y < f.minHeight) camDesired.y = f.minHeight;
      camera.position.lerp(camDesired, f.posLerp);
      camera.lookAt(lookPoint);

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
