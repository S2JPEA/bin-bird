<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bins Chickens</title>
  <style>
    /* ---- base / layout ---------------------------------------------------- */
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #11161d; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #eef2f6;
      -webkit-font-smoothing: antialiased;
    }
    #game { display: block; width: 100vw; height: 100vh; touch-action: none; }

    /* ---- UI overlay (filled in later stages: HUD, start/win/fail screens) -- */
    #ui { position: fixed; inset: 0; pointer-events: none; }

    /* small build tag so it's obvious which stage is live */
    #stage-tag {
      position: fixed; left: 10px; bottom: 8px;
      font-size: 12px; letter-spacing: .04em; color: #8fa3b6;
      opacity: .75; pointer-events: none; user-select: none;
    }
  </style>

  <!-- Three.js from CDN, pinned. Addons mapped for later stages (geometry merge, etc.). -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"><!-- HUD + screens added in later stages --></div>
  <div id="stage-tag">Bins Chickens — stage 2 · click to look · WASD move · Shift run</div>

  <script type="module">
    import * as THREE from 'three';

    /* ======================================================================
     * CONFIG — single source of truth (grows each stage; see DESIGN.md §9)
     * Stage 1 only needs world size, palette and camera basics.
     * ==================================================================== */
    const CONFIG = {
      world: {
        size: 120,          // ground extent in units (compact CBD, DESIGN.md §9)
      },
      palette: {
        sky:    0x9fc6e8,   // hazy Brisbane sky
        fog:    0x9fc6e8,   // match sky so the horizon dissolves
        ground: 0x7a8b5e,   // dusty green-grey
        grid:   0x61708f,   // faint street-grid tint
        sun:    0xfff2d6,   // warm key light
      },
      camera: {
        fov: 55, near: 0.1, far: 600,
        follow: {
          distance: 10,      // how far behind the ibis the camera sits
          lookHeight: 1.3,   // aim point above the ibis's feet
          posLerp: 0.12,     // camera position smoothing per frame
          minHeight: 0.8,    // never let the camera dip below this
          yawSensitivity: 0.0026,
          pitchSensitivity: 0.0020,
          pitch: 0.28,       // initial elevation (radians)
          pitchMin: -0.15,
          pitchMax: 0.85,
        },
      },
      fog: { near: 60, far: 240 },
      ibis: {
        walkSpeed: 9,        // units / second
        sprintMul: 1.7,      // hold Shift to run
        turnLerp: 0.2,       // how quickly the ibis turns to face travel
        bodyHeight: 0.75,    // torso-root height above the ground
        bound: 0.92,         // stay within this fraction of the half-world
      },
    };

    /* ======================================================================
     * RENDERER
     * ==================================================================== */
    const canvas = document.getElementById('game');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    /* ======================================================================
     * SCENE + atmosphere
     * ==================================================================== */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(CONFIG.palette.sky);
    scene.fog = new THREE.Fog(CONFIG.palette.fog, CONFIG.fog.near, CONFIG.fog.far);

    /* ======================================================================
     * CAMERA
     * ==================================================================== */
    const camera = new THREE.PerspectiveCamera(
      CONFIG.camera.fov,
      window.innerWidth / window.innerHeight,
      CONFIG.camera.near,
      CONFIG.camera.far
    );
    camera.position.set(0, 6, 12);
    camera.lookAt(0, 0, 0);
    let camYaw = 0;                              // mouse-controlled orbit yaw
    let camPitch = CONFIG.camera.follow.pitch;   // mouse-controlled elevation

    /* ======================================================================
     * LIGHTS — cheap two-light rig (DESIGN.md §5.1)
     * ==================================================================== */
    const hemi = new THREE.HemisphereLight(CONFIG.palette.sky, CONFIG.palette.ground, 0.9);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(CONFIG.palette.sun, 1.1);
    sun.position.set(40, 60, 20);
    scene.add(sun);

    /* ======================================================================
     * GROUND — stylised plane sized to the world, with a faint street grid
     * ==================================================================== */
    const groundGeo = new THREE.PlaneGeometry(CONFIG.world.size, CONFIG.world.size);
    const groundMat = new THREE.MeshLambertMaterial({ color: CONFIG.palette.ground });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;   // lay flat
    scene.add(ground);

    // faint grid for scale + motion cues (one line-segments draw call)
    const grid = new THREE.GridHelper(
      CONFIG.world.size, CONFIG.world.size / 4,
      CONFIG.palette.grid, CONFIG.palette.grid
    );
    grid.material.transparent = true;
    grid.material.opacity = 0.25;
    grid.position.y = 0.02;             // avoid z-fighting with the ground
    scene.add(grid);

    /* ======================================================================
     * IBIS — procedural low-poly bin chicken (DESIGN.md §3.2)
     * root (world position + facing yaw) → body group (waddle) → parts.
     * Local forward is +Z (torso long axis, neck and beak lead that way).
     * ==================================================================== */
    function createIbis() {
      const COL = { body: 0xeae7dd, dark: 0x23242a, leg: 0x4a4f57, eye: 0xf2f2f2 };
      const matBody = new THREE.MeshLambertMaterial({ color: COL.body });
      const matDark = new THREE.MeshLambertMaterial({ color: COL.dark });
      const matLeg  = new THREE.MeshLambertMaterial({ color: COL.leg });
      const matEye  = new THREE.MeshLambertMaterial({ color: COL.eye });

      const root = new THREE.Group();   // placement + yaw
      const body = new THREE.Group();   // animation transforms
      root.add(body);

      // torso — ovoid, long axis forward
      const torso = new THREE.Mesh(new THREE.SphereGeometry(0.55, 12, 10), matBody);
      torso.scale.set(1.0, 0.85, 1.45);
      body.add(torso);

      // tail plume — dark, swept up at the back (−Z)
      const tail = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.7, 8), matDark);
      tail.position.set(0, 0.12, -0.78);
      tail.rotation.x = -Math.PI * 0.62;
      body.add(tail);

      // neck — dark, rising and leaning forward from the front of the torso
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.17, 0.95, 8), matDark);
      neck.position.set(0, 0.5, 0.55);
      neck.rotation.x = 0.5;
      body.add(neck);

      // head — dark sphere + long down-curved black beak + pale eyes
      const head = new THREE.Group();
      head.position.set(0, 0.95, 0.84);
      body.add(head);
      head.add(new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8), matDark));
      const beak = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.78, 7), matDark);
      beak.position.set(0, -0.06, 0.42);
      beak.rotation.x = Math.PI * 0.62;   // forward and down — the ibis's signature
      head.add(beak);
      const eyeGeo = new THREE.SphereGeometry(0.035, 6, 6);
      for (const sx of [-1, 1]) {
        const eye = new THREE.Mesh(eyeGeo, matEye);
        eye.position.set(0.09 * sx, 0.05, 0.1);
        head.add(eye);
      }

      // wings — flattened, folded along the torso (flap comes in stage 5)
      const wings = [];
      for (const sx of [-1, 1]) {
        const wing = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 6), matBody);
        wing.scale.set(0.18, 0.5, 1.1);
        wing.position.set(0.5 * sx, 0.06, -0.05);
        body.add(wing);
        wings.push(wing);
      }

      // legs — thin cylinders + a little foot, pivoting from the hip
      const legs = [];
      for (const sx of [-1, 1]) {
        const leg = new THREE.Group();
        leg.position.set(0.17 * sx, -0.2, 0.0);
        const shank = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.55, 6), matLeg);
        shank.position.y = -0.275;
        leg.add(shank);
        const foot = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.22), matLeg);
        foot.position.set(0, -0.55, 0.05);
        leg.add(foot);
        body.add(leg);
        legs.push(leg);
      }

      root.userData = { body, head, neck, wings, legs, walkPhase: 0 };
      return root;
    }

    const ibis = createIbis();
    ibis.position.set(0, CONFIG.ibis.bodyHeight, 0);
    scene.add(ibis);

    // shortest-arc angle lerp (keeps turning from spinning the long way round)
    function lerpAngle(a, b, t) {
      let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
      if (d < -Math.PI) d += Math.PI * 2;
      return a + d * t;
    }

    // procedural waddle / idle bob
    function animateIbis(root, dt, moving) {
      const u = root.userData;
      u.walkPhase += dt * (moving ? 10 : 2.2);
      const amp = moving ? 1 : 0.35;
      u.body.position.y = Math.abs(Math.sin(u.walkPhase)) * 0.05 * amp;
      u.body.rotation.z = Math.sin(u.walkPhase) * 0.06 * amp;        // side-to-side waddle
      u.neck.rotation.z = Math.sin(u.walkPhase + 0.5) * 0.04 * amp;
      u.head.rotation.x = Math.sin(u.walkPhase * 2) * 0.05 * amp;    // beak nod
      const swing = moving ? Math.sin(u.walkPhase) * 0.5 : 0;
      u.legs[0].rotation.x = swing;
      u.legs[1].rotation.x = -swing;
    }

    /* ======================================================================
     * INPUT — keyboard + pointer-lock mouse look
     * ==================================================================== */
    const keys = Object.create(null);
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // stop arrow keys / space from scrolling the page
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

    canvas.addEventListener('click', () => {
      if (document.pointerLockElement !== canvas) canvas.requestPointerLock();
    });
    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== canvas) return;
      const f = CONFIG.camera.follow;
      camYaw   -= e.movementX * f.yawSensitivity;
      camPitch -= e.movementY * f.pitchSensitivity;
      camPitch = Math.max(f.pitchMin, Math.min(f.pitchMax, camPitch));
    });

    /* ======================================================================
     * RESIZE
     * ==================================================================== */
    function onResize() {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);

    /* ======================================================================
     * MAIN LOOP — delta-clamped (DESIGN.md §5.7)
     * Stage 2: ground movement relative to the camera + smoothed follow cam.
     * ==================================================================== */
    const clock = new THREE.Clock();
    const UP = new THREE.Vector3(0, 1, 0);
    const fwd = new THREE.Vector3();
    const right = new THREE.Vector3();
    const moveVec = new THREE.Vector3();
    const lookPoint = new THREE.Vector3();
    const camDesired = new THREE.Vector3();

    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);   // clamp to survive tab stalls
      const f = CONFIG.camera.follow;

      // --- movement, relative to camera yaw ---
      fwd.set(-Math.sin(camYaw), 0, -Math.cos(camYaw));   // "forward" = away from camera
      right.crossVectors(fwd, UP).normalize();            // screen-right
      moveVec.set(0, 0, 0);
      if (keys['KeyW'] || keys['ArrowUp'])    moveVec.add(fwd);
      if (keys['KeyS'] || keys['ArrowDown'])  moveVec.sub(fwd);
      if (keys['KeyD'] || keys['ArrowRight']) moveVec.add(right);
      if (keys['KeyA'] || keys['ArrowLeft'])  moveVec.sub(right);

      const moving = moveVec.lengthSq() > 0;
      if (moving) {
        moveVec.normalize();
        const sprint = (keys['ShiftLeft'] || keys['ShiftRight']) ? CONFIG.ibis.sprintMul : 1;
        ibis.position.addScaledVector(moveVec, CONFIG.ibis.walkSpeed * sprint * dt);

        const lim = (CONFIG.world.size / 2) * CONFIG.ibis.bound;   // stay on the map
        ibis.position.x = Math.max(-lim, Math.min(lim, ibis.position.x));
        ibis.position.z = Math.max(-lim, Math.min(lim, ibis.position.z));

        const targetYaw = Math.atan2(moveVec.x, moveVec.z);        // face travel
        ibis.rotation.y = lerpAngle(ibis.rotation.y, targetYaw, CONFIG.ibis.turnLerp);
      }
      ibis.position.y = CONFIG.ibis.bodyHeight;

      animateIbis(ibis, dt, moving);

      // --- smoothed follow camera, orbited by the mouse ---
      lookPoint.copy(ibis.position); lookPoint.y += f.lookHeight;
      const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
      camDesired.set(
        lookPoint.x + Math.sin(camYaw) * cp * f.distance,
        lookPoint.y + sp * f.distance,
        lookPoint.z + Math.cos(camYaw) * cp * f.distance
      );
      if (camDesired.y < f.minHeight) camDesired.y = f.minHeight;
      camera.position.lerp(camDesired, f.posLerp);
      camera.lookAt(lookPoint);

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
